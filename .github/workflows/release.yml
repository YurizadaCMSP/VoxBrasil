name: Release VoxBrasil

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.23.2

      - name: Generate build files
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release .. -A Win32
          cmake --build . --config Release

      - name: Package Windows release
        run: |
          mkdir -p release
          powershell -Command "Compress-Archive -Path build/server/Release/sampvoice.dll -DestinationPath release/VoxBrasil-Windows-${{ github.ref_name }}.zip -Force"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxBrasil-Windows
          path: release/*.zip

  build-linux:
    name: Build Linux release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Build Linux
        run: |
          cd docker
          chmod +x ./build.sh
          chmod +x ./docker-entrypoint.sh
          ./build.sh
          mkdir -p release
          cp docker/build/server/sampvoice.so release/VoxBrasil-Linux-${{ github.ref_name }}.so
          cd release
          zip -r VoxBrasil-Linux-${{ github.ref_name }}.zip VoxBrasil-Linux-${{ github.ref_name }}.so

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxBrasil-Linux
          path: release/*.zip

  release:
    name: Create GitHub Release
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: Release ${{ github.ref_name }}
          files: release-artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
